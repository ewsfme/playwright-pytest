name: E2E Tests (Playwright + Pytest + Allure)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run against"
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests in parallel
        id: run_tests
        continue-on-error: true
        run: |
          pytest --browser ${{ matrix.browser }} -n 4 \
            --alluredir=allure-results/${{ matrix.browser }}

      - name: Upload allure-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/${{ matrix.browser }}
          retention-days: 5

      - name: Mark job status
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all allure-results artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results-all

      - name: Merge allure-results
        run: |
          mkdir -p allure-results
          if [ -d "allure-results-all" ]; then
            find allure-results-all -mindepth 2 -type f -exec cp -n {} allure-results/ \;
          else
            echo "No allure-results artifacts found - skipping merge"
          fi

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -o allure.zip -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip -d /opt
          echo "/opt/allure-2.29.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: ${{ github.run_number }}

      - name: Publish "latest" alias on GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: latest

      - name: Set up Python for Slack notifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notifier dependencies
        run: pip install requests

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/
          RUN_STATUS: ${{ needs.test.result }}
          ALLURE_SUMMARY_PATH: allure-report/widgets/summary.json
        run: python utils/slack_notifier.py
