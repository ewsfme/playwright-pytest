name: E2E Tests (Playwright + Pytest + Allure)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run against"
        required: false
        default: all
        type: choice
        options: [all, chromium, firefox, webkit]

  schedule:
    - cron: "0 6 * * *"

  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # Пропускаємо непотрібні браузери при ручному запуску конкретного браузера
      - name: Check browser filter
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser
        run: |
          echo "Skipping ${{ matrix.browser }} due to manual dispatch selection"
          exit 0

      - name: Checkout repository
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        uses: actions/checkout@v4

      - name: Set up Python
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        id: run_tests
        continue-on-error: true
        run: |
          mkdir -p allure-results/${{ matrix.browser }}

          pytest \
            --browser ${{ matrix.browser }} \
            -n 4 \
            --alluredir=allure-results/${{ matrix.browser }}

      - name: Upload allure-results
        if: always() && !(github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'all' && github.event.inputs.browser != matrix.browser)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 5

      - name: Mark job status
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  report:
    needs: test
    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Завантажуємо поточну гілку gh-pages для копіювання історії тестів
      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: downloaded-results
          merge-multiple: true

      - name: Prepare Allure results and history
        run: |
          mkdir -p allure-results

          # Копіюємо всі знайдені файли результатів
          if [ -d "downloaded-results" ]; then
            find downloaded-results -type f \( \
              -name "*-result.json" -o \
              -name "*-container.json" -o \
              -name "*.png" -o \
              -name "*.jpg" -o \
              -name "*.jpeg" -o \
              -name "*.txt" -o \
              -name "*.html" -o \
              -name "*.webm" \
            \) -exec cp {} allure-results/ \;
          fi

          # Підкидаємо попередню історію, якщо вона існує на gh-pages
          if [ -d "gh-pages-branch/latest/history" ]; then
            echo "Copying previous Allure history..."
            cp -r gh-pages-branch/latest/history allure-results/
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip -d /opt
          echo "/opt/allure-2.29.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload generated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 5

      # Деплоїмо звіт для поточного білда (зі збереженням інших папок)
      - name: Deploy build report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: ${{ github.run_number }}
          keep_files: true

      # Оновлюємо посилання latest
      - name: Deploy latest report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: latest
          keep_files: true

      - name: Set up Python for Slack notifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notifier dependencies
        run: |
          pip install requests

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/
          RUN_STATUS: ${{ needs.test.result }}
          ALLURE_SUMMARY_PATH: allure-report/widgets/summary.json
        run: |
          if [ -f utils/slack_notifier.py ]; then
            python utils/slack_notifier.py
          fi