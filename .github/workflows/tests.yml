name: E2E Tests (Playwright + Pytest + Allure)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run against"
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

  schedule:
    - cron: "0 6 * * *"

  push:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          mkdir -p allure-results/${{ matrix.browser }}

          pytest \
            --browser ${{ matrix.browser }} \
            -n 4 \
            --alluredir=allure-results/${{ matrix.browser }}

      - name: Debug Allure results
        if: always()
        run: |
          echo "=== Allure directory ==="
          find allure-results -type f -print || true

          echo "=== Number of files ==="
          find allure-results -type f | wc -l

          echo "=== Result JSON files ==="
          find allure-results -name "*-result.json" -print || true

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 5

      - name: Mark job status
        if: steps.run_tests.outcome == 'failure'
        run: exit 1


  report:
    needs: test
    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: downloaded-results
          merge-multiple: true

      - name: Prepare Allure results
        run: |
          mkdir -p allure-results

          echo "=== Downloaded files ==="
          find downloaded-results -type f -print || true

          echo "=== Copying results ==="

          find downloaded-results -type f \
            \( -name "*-result.json" \
            -o -name "*-container.json" \
            -o -name "*.png" \
            -o -name "*.jpg" \
            -o -name "*.jpeg" \
            -o -name "*.txt" \
            -o -name "*.html" \
            -o -name "*.webm" \
            \) \
            -exec cp {} allure-results/ \;

          echo "=== Final Allure results ==="
          find allure-results -type f -print || true

          echo "=== Result count ==="
          find allure-results -name "*-result.json" | wc -l

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -L \
            -o allure.zip \
            https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip

          unzip -q allure.zip -d /opt

          echo "/opt/allure-2.29.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: |
          echo "=== Generating Allure report ==="

          allure generate allure-results \
            --clean \
            -o allure-report

          echo "=== Generated report ==="
          find allure-report -maxdepth 2 -type f | head -50

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 5

      - name: Deploy report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: ${{ github.run_number }}

      - name: Deploy latest report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: latest

      - name: Set up Python for Slack notifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notifier dependencies
        run: |
          pip install requests

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/
          RUN_STATUS: ${{ needs.test.result }}
          ALLURE_SUMMARY_PATH: allure-report/widgets/summary.json
        run: |
          python utils/slack_notifier.py